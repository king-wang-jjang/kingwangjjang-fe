name: AWS CI/CD

on:
  pull_request:
    branches: [main, develop]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Setup Node.js environment
        uses: actions/setup-node@v2
        with:
          node-version: '20'

      - name: Register QEMU
        run: |
          docker run --privileged --rm tonistiigi/binfmt --install all

      - name: Log in to Docker Hub
        run: echo "${{ secrets.DOCKERHUB_TOKEN }}" | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build Docker image for ARM
        run: |
          docker buildx create --use
          docker buildx build --platform linux/arm64 -t "${{ secrets.DOCKERHUB_USERNAME }}/kingwangjjang-fe:0.0.1" --push .

  deploy:
    needs: build
    name: Deploy
    runs-on: ubuntu-latest

    steps:
      - name: Connect to WAS & Execute Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.WAS_SSH_PORT }}
          script: |
            sudo docker version
            sudo docker rm -f kingwangjjang-fe || true
            sudo docker pull "${{ secrets.DOCKERHUB_USERNAME }}/kingwangjjang-fe:0.0.1"
            sudo docker run -d --name kingwangjjang-fe -p 8083:8083 "${{ secrets.DOCKERHUB_USERNAME }}/kingwangjjang-fe:0.0.1"
