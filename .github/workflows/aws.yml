name: ORACLE ARM64 CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Setup Node.js environment
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Login docker hub
        uses: docker/login-action@master
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/kingwangjjang-fe:0.0.1
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_IMAGE_SERVER_URL=${{ secrets.NEXT_PUBLIC_IMAGE_SERVER_URL }}
            NEXT_PUBLIC_BUILD_STATIC_EXPORT=false
          platforms: |
            linux/arm64
            linux/amd64

  run:
    needs: build
    name: Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Create .env file
        run: |
          set -euo pipefail
          SERVER_URL="${{ secrets.NEXT_PUBLIC_SERVER_URL }}"
          IMAGE_SERVER_URL="${{ secrets.NEXT_PUBLIC_IMAGE_SERVER_URL }}"
          echo "NEXT_PUBLIC_SERVER_URL=${SERVER_URL:-https://api.마약.kr}" >> .env
          echo "NEXT_PUBLIC_IMAGE_SERVER_URL=${IMAGE_SERVER_URL:-https://images.마약.kr}" >> .env
          echo "NEXT_PUBLIC_BUILD_STATIC_EXPORT=false" >> .env
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env

      - name: Upload secrets,docker-compose to WAS instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          port: ${{ secrets.WAS_SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: ".env,docker-compose.yml"
          target: "/home/ubuntu/kingwangjjang/fe/"
          overwrite: true

      - name: Connect to WAS & Execute Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.WAS_SSH_PORT }}
          script: |
              sudo docker version
              cd kingwangjjang/fe
              sudo docker-compose down
              sudo docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/kingwangjjang-fe:0.0.1 -f || true
              sudo docker-compose up -d
      # sudo docker network connect kingwangjjang-network kingwangjjang-fe
