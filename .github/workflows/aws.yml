name: ORACLE ARM64 CI/CD

on:
  push:
    branches: [develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  contents: read

# Serialize deployments; a newer push must not interrupt a running deployment.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-24.04
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login docker hub
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/develop' }}
          tags: ${{ secrets.DOCKERHUB_USERNAME || 'local' }}/kingwangjjang-fe:build-${{ github.run_id }}-${{ matrix.arch }}
          build-args: |
            NEXT_PUBLIC_SERVER_URL=${{ secrets.NEXT_PUBLIC_SERVER_URL }}
            NEXT_PUBLIC_IMAGE_SERVER_URL=${{ secrets.NEXT_PUBLIC_IMAGE_SERVER_URL }}
            NEXT_PUBLIC_BUILD_STATIC_EXPORT=false
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=frontend-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=frontend-${{ matrix.arch }}

  publish:
    name: Publish multi-platform image
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/develop'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login docker hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Merge native images into the deployment tag
        env:
          IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/kingwangjjang-fe
          BUILD_TAG: build-${{ github.run_id }}
        run: |
          docker buildx imagetools create \
            --tag "${IMAGE_NAME}:0.0.1" \
            "${IMAGE_NAME}:${BUILD_TAG}-amd64" \
            "${IMAGE_NAME}:${BUILD_TAG}-arm64"
          docker buildx imagetools inspect "${IMAGE_NAME}:0.0.1"

  run:
    needs: publish
    name: Run
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
      - name: Create .env file
        env:
          SERVER_URL: ${{ secrets.NEXT_PUBLIC_SERVER_URL }}
          IMAGE_SERVER_URL: ${{ secrets.NEXT_PUBLIC_IMAGE_SERVER_URL }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          {
            printf '%s\n' "NEXT_PUBLIC_SERVER_URL=${SERVER_URL:-https://api.마약.kr}"
            printf '%s\n' "NEXT_PUBLIC_IMAGE_SERVER_URL=${IMAGE_SERVER_URL:-https://images.마약.kr}"
            printf '%s\n' "NEXT_PUBLIC_BUILD_STATIC_EXPORT=false"
            printf '%s\n' "DOCKERHUB_USERNAME=${DOCKERHUB_USERNAME}"
          } > .env

      - name: Upload secrets,docker-compose to WAS instance
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          port: ${{ secrets.WAS_SSH_PORT }}
          key: ${{ secrets.SSH_KEY }}
          source: '.env,docker-compose.yml'
          target: '/home/ubuntu/kingwangjjang/fe/'
          overwrite: true

      - name: Connect to WAS & Execute Application
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.WAS_HOST }}
          username: ${{ secrets.WAS_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.WAS_SSH_PORT }}
          script: |
            sudo docker version
            cd kingwangjjang/fe
            sudo docker-compose down
            sudo docker rmi ${{ secrets.DOCKERHUB_USERNAME }}/kingwangjjang-fe:0.0.1 -f || true
            sudo docker-compose up -d
      # sudo docker network connect kingwangjjang-network kingwangjjang-fe
