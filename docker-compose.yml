version: '3.3'

networks:
  kingwangjjang-network:
    external: true

services:
  kingwangjjang-fe:
    image: ${DOCKERHUB_USERNAME}/kingwangjjang-fe:0.0.1
    ports:
      - '8083:8083'
    env_file:
      - .env
    volumes:
      - ./log:/home/ubuntu/kingwangjjang/logs
    networks:
      - kingwangjjang-network
